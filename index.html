<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEXA - Your Story Assistant</title>
    <style>
        :root {
            --bg-color: #121214;
            --sidebar-bg: #1a1a1e;
            --chat-bg: #161619;
            --text-color: #e2e8f0;
            --accent-color: #bb86fc;
            --user-msg: #3700b3;
            --alexa-msg: #2d2d34;
            --border-color: #2a2a32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .new-chat-btn {
            background-color: var(--accent-color);
            color: #121214;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border: 1px solid transparent;
        }

        .chat-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .chat-item.active {
            background-color: rgba(187, 134, 252, 0.15);
            border-color: var(--accent-color);
        }

        .chat-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1.1rem;
            display: none;
        }

        .chat-item:hover .delete-btn {
            display: block;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
        }

        header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        header p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .alexa-message {
            background-color: var(--alexa-msg);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 3px solid var(--accent-color);
        }

        #input-container {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border-color);
        }

        textarea {
            flex: 1;
            background-color: #222226;
            border: 1px solid #3a3a44;
            border-radius: 8px;
            color: white;
            padding: 12px;
            resize: none;
            height: 24px;
            font-family: inherit;
            font-size: 1rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        #send-btn {
            background-color: var(--accent-color);
            color: #121214;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #send-btn:disabled {
            background-color: #3a3a44;
            color: #777;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">+ New Story Session</button>
        <div id="chat-list"></div>
    </div>

    <div id="main-content">
        <header>
            <h1>ALEXA</h1>
            <p>✨ Happy Birthday! Your Custom AI Creative Partner</p>
        </header>

        <div id="chat-container"></div>

        <div id="input-container">
            <textarea id="user-input" placeholder="Brainstorm a story scene or write a prompt..." rows="1"></textarea>
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatListContainer = document.getElementById('chat-list');

        const initialAlexaGreeting = "Hi there! I am ALEXA, your personal AI assistant. I hear you love writing stories! Tell me an idea, a character, or just say hi, and let's create something magical together! 📝✨";

        let conversations = JSON.parse(localStorage.getItem('alexa_chats')) || {};
        let currentChatId = localStorage.getItem('alexa_current_id') || null;

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function initApp() {
            if (Object.keys(conversations).length === 0) {
                createNewChat();
            } else {
                if (!currentChatId || !conversations[currentChatId]) {
                    currentChatId = Object.keys(conversations)[0];
                }
                renderChatList();
                loadActiveChatHistory();
            }
        }

        function createNewChat() {
            const id = 'chat_' + Date.now();
            conversations[id] = {
                title: "New Story Session",
                history: [
                    { role: 'alexa', text: initialAlexaGreeting }
                ]
            };
            currentChatId = id;
            saveData();
            renderChatList();
            loadActiveChatHistory();
        }

        function renderChatList() {
            chatListContainer.innerHTML = '';
            Object.keys(conversations).sort((a, b) => b.split('_')[1] - a.split('_')[1]).forEach(id => {
                const item = document.createElement('div');
                item.className = `chat-item ${id === currentChatId ? 'active' : ''}`;
                item.onclick = () => switchChat(id);

                const titleSpan = document.createElement('span');
                titleSpan.className = 'chat-title';
                titleSpan.innerText = conversations[id].title;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '🗑️';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteChat(id);
                };

                item.appendChild(titleSpan);
                item.appendChild(delBtn);
                chatListContainer.appendChild(item);
            });
        }

        function switchChat(id) {
            currentChatId = id;
            localStorage.setItem('alexa_current_id', currentChatId);
            renderChatList();
            loadActiveChatHistory();
        }

        function deleteChat(id) {
            if (confirm("Are you sure you want to delete this chat history?")) {
                delete conversations[id];
                saveData();
                if (currentChatId === id) {
                    currentChatId = Object.keys(conversations)[0] || null;
                }
                initApp();
            }
        }

        function loadActiveChatHistory() {
            chatContainer.innerHTML = '';
            const activeChat = conversations[currentChatId];
            if (activeChat && activeChat.history) {
                activeChat.history.forEach(msg => {
                    appendMessageUI(msg.text, msg.role === 'user' ? 'user-message' : 'alexa-message');
                });
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            conversations[currentChatId].history.push({ role: 'user', text: text });

            if (conversations[currentChatId].title === "New Story Session") {
                conversations[currentChatId].title = text.length > 22 ? text.substring(0, 22) + '...' : text;
                renderChatList();
            }

            appendMessageUI(text, 'user-message');
            const alexaPlaceholder = appendMessageUI("ALEXA is writing...", 'alexa-message');

            // Build structural raw prompt history block
            const basePrompt = "System Instruction: You are ALEXA, a creative AI story assistant.\n\n" +
                conversations[currentChatId].history.map(m => `${m.role === 'user' ? 'User' : 'ALEXA'}: ${m.text}`).join("\n") + "\nALEXA:";

            // Fully secure URL encoding string bypasses browser payload filtering completely
            const finalUrl = `https://text.pollinations.ai/${encodeURIComponent(basePrompt)}?model=openai`;

            try {
                const response = await fetch(finalUrl);
                if (!response.ok) throw new Error();

                const replyText = await response.text();
                const cleanedReply = replyText.trim();

                alexaPlaceholder.innerText = cleanedReply;
                conversations[currentChatId].history.push({ role: 'alexa', text: cleanedReply });
                saveData();

            } catch (error) {
                console.error(error);
                alexaPlaceholder.innerText = "ALEXA took too long to think. Check your internet connection and send your prompt one more time!";
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function appendMessageUI(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function saveData() {
            localStorage.setItem('alexa_chats', JSON.stringify(conversations));
            localStorage.setItem('alexa_current_id', currentChatId);
        }

        initApp();
    </script>
</body>
</html>
